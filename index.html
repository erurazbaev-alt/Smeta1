<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Простая смета</p>
      <h1>Смета за 5 минут</h1>
      <p class="lead">Добавьте работы или товары — суммы и итог посчитаются автоматически.</p>
    </header>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Реквизиты</h2>
      <div class="details-grid">
        <label>
          <span>От кого</span>
          <input type="text" id="from" autocomplete="organization" placeholder="Название или имя">
        </label>
        <label>
          <span>Для кого</span>
          <input type="text" id="to" autocomplete="off" placeholder="Клиент или организация">
        </label>
        <label>
          <span>Номер сметы</span>
          <input type="text" id="estimate-number" inputmode="numeric" placeholder="Например, 001">
        </label>
        <label>
          <span>Дата</span>
          <input type="date" id="estimate-date">
        </label>
      </div>
    </section>

    <section class="card positions-card" aria-labelledby="positions-title">
      <div class="section-heading">
        <div>
          <h2 id="positions-title">Позиции</h2>
          <p>Укажите количество и цену за единицу.</p>
        </div>
        <button type="button" class="add-button" id="add-row">+ Добавить позицию</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Наименование</th>
              <th scope="col">Количество</th>
              <th scope="col">Единица</th>
              <th scope="col">Цена</th>
              <th scope="col">Сумма</th>
              <th scope="col"><span class="visually-hidden">Удалить</span></th>
            </tr>
          </thead>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
    </section>

    <section class="total-card" aria-live="polite">
      <span>Итого к оплате</span>
      <strong id="grand-total">0 ₸</strong>
    </section>
  </main>

  <template id="position-template">
    <tr class="position-row">
      <td data-label="Наименование">
        <input class="item-name" type="text" aria-label="Наименование позиции" placeholder="Например, монтаж">
      </td>
      <td data-label="Количество">
        <input class="item-quantity" type="text" inputmode="decimal" aria-label="Количество" placeholder="0">
      </td>
      <td data-label="Единица">
        <select class="item-unit" aria-label="Единица измерения">
          <option value="шт">шт</option>
          <option value="час">час</option>
          <option value="услуга">услуга</option>
        </select>
      </td>
      <td data-label="Цена">
        <input class="item-price" type="text" inputmode="decimal" aria-label="Цена за единицу" placeholder="0">
      </td>
      <td class="row-total-cell" data-label="Сумма">
        <output class="row-total">0 ₸</output>
      </td>
      <td class="delete-cell" data-label="Удалить">
        <button type="button" class="delete-button" aria-label="Удалить позицию">✕</button>
      </td>
    </tr>
  </template>

  <script src="script.js"></script>
</body>
</html>
